[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamics-cellulose"
version = "0.6.0"
description = "Pure-Python builder for experimental cellulose I-alpha, I-beta, II, and III-I crystals"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dynamics-cellulose = "cellulose_core.cli:main"

[tool.setuptools.package-data]
cellulose_core = ["data/*.cif", "data/*.md"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cellulose-modeler"
version = "0.8.0"
description = "Pure-Python builder for experimental cellulose I-alpha, I-beta, II, and III-I crystals"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "André de Araújo Caetano" },
]
keywords = [
    "cellulose",
    "molecular-modeling",
    "crystallography",
    "nanocellulose",
    "PDB",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = []

[project.scripts]
cellulose-modeler = "cellulose_modeler.cli:main"

[tool.setuptools.package-data]
cellulose_modeler = ["data/*.cif", "data/*.md"]

[tool.setuptools.packages.find]
include = ["cellulose_modeler*"]

[project.urls]
Homepage = "https://github.com/andre-aracaetano/cellulose-modeler"
Repository = "https://github.com/andre-aracaetano/cellulose-modeler"
Documentation = "https://github.com/andre-aracaetano/cellulose-modeler#readme"
Issues = "https://github.com/andre-aracaetano/cellulose-modeler/issues"

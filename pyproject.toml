[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamics-cellulose"
version = "0.5.0"
description = "Pure-Python builder for cellulose I-beta from open experimental CIF data"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dynamics-cellulose = "cellulose_core.cli:main"

[tool.setuptools.package-data]
cellulose_core = ["data/*.cif", "data/*.md"]

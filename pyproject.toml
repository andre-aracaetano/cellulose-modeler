[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cellulose-modeler"
version = "0.7.0"
description = "Pure-Python builder for experimental cellulose I-alpha, I-beta, II, and III-I crystals"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cellulose-modeler = "cellulose_modeler.cli:main"

[tool.setuptools.package-data]
cellulose_modeler = ["data/*.cif", "data/*.md"]

[project.urls]
Repository = "https://github.com/andre-aracaetano/cellulose-modeler"
